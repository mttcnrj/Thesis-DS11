[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pasig"
version = "0.1.0"
description = "Pasig River (EFCOS Pandacan) 1-6 h water-level forecasting as a flood-risk indicator for Sampaloc"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1", "numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.3", "statsmodels>=0.14",
  "pyarrow>=14", "openpyxl>=3.1", "odfpy>=1.4", "pyyaml>=6", "matplotlib>=3.8", "psutil>=5.9",
]

[tool.setuptools.packages.find]
include = ["pasig*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "fast: synthetic fixtures only, runs in < 1 min",
  "data: needs the real processed files under data/",
]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["scripts/smoke"]   # kept exactly as provided in smoke_tests.zip (Section 12)

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]
